<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lista de Inventario — Leila &amp; Pedro</title>
<link rel="stylesheet" href="assets/style.css" />
</head>

<body>

<script>
  window.CLEANER_ID = "leila-pedro";
  window.CLEANER_NAME = "Leila & Pedro";
  window.CLEANER_PROPERTIES = [
    "Bates Walk",
    "Edgar's Bungalow"
  ];
</script>

<div class="topbar">
  <h1>Lista de Inventario</h1>
  <p class="subtitle">
    Asignado a: <span id="cleaner-name"></span>
  </p>
</div>

<div class="container">

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-label-text">0 / 0 marcados</span>
      <span id="last-saved"></span>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="actions">

    <button class="btn btn-primary" id="copy-btn">
      Copiar Lista de Reposición
    </button>

    <button class="btn btn-primary" id="submit-btn">
      Enviar Lista de Reposición
    </button>

    <button class="btn btn-secondary" id="print-btn">
      Imprimir
    </button>

    <button class="btn btn-secondary" id="reset-btn">
      Reiniciar
    </button>

  </div>

  <div id="submit-status" class="submit-status"></div>

  <div id="checklist-root"></div>

</div>

<footer class="note">
  Los datos se guardan solamente en este dispositivo/navegador.
</footer>


<!-- Restock List Modal -->

<div class="copy-modal-overlay" id="copy-modal-overlay">

  <div class="copy-modal">

    <h3 id="modal-title">
      Lista de Reposición
    </h3>

    <p id="modal-subtitle">
      Copiado. Puedes pegar esta lista en un mensaje o correo electrónico para tu gerente.
    </p>

    <textarea id="copy-textarea" readonly></textarea>

    <div class="actions">

      <button class="btn btn-primary" id="close-modal-btn">
        Cerrar
      </button>

    </div>

  </div>

</div>


<script src="assets/items.js"></script>

<script src="assets/app.js"></script>


<script>

/* =========================================================
   SPANISH TRANSLATIONS — LEILA & PEDRO ONLY
   ========================================================= */

const SPANISH_TRANSLATIONS = {

  /* Categories */

  "Kitchen Essentials": "Artículos esenciales de cocina",
  "Bathroom": "Baño",
  "Laundry": "Lavandería",
  "Cleaning Supplies": "Productos de limpieza",

  /* Kitchen */

  "Coffee": "Café",
  "Salt": "Sal",
  "Pepper": "Pimienta",
  "Cooking Oil": "Aceite de cocina",
  "Aluminum Foil": "Papel de aluminio",
  "Plastic Wrap": "Papel film",
  "Zip-top Bags": "Bolsas con cierre",
  "Dish Soap": "Jabón para platos",
  "Dishwasher Pods": "Cápsulas para lavavajillas",
  "Kitchen Sponge": "Esponja de cocina",
  "Paper Towels": "Toallas de papel",
  "Trash Bags": "Bolsas de basura",

  /* Bathroom */

  "Toilet Paper": "Papel higiénico",
  "Facial Tissue": "Pañuelos desechables",
  "Hand Soap": "Jabón de manos",
  "Shampoo": "Champú",
  "Conditioner": "Acondicionador",
  "Body Wash": "Gel de baño",
  "Mini Trash Bags": "Bolsas pequeñas de basura",

  /* Laundry */

  "Detergent": "Detergente",
  "Dryer Sheets": "Toallitas para secadora",

  /* Cleaning */

  "Multi-surface Cleaner": "Limpiador multisuperficie",
  "Bathroom Cleaner": "Limpiador de baño",
  "Disinfectant Spray": "Spray desinfectante",

  /* Units */

  "bags": "bolsas",
  "containers": "recipientes",
  "bottles": "botellas",
  "rolls": "rollos",
  "boxes": "cajas",
  "packs": "paquetes",
  "pcs": "unidades"

};


/* =========================================================
   TRANSLATE TEXT
   ========================================================= */

function translateText(text) {

  if (!text) return text;

  let translated = text;

  Object.keys(SPANISH_TRANSLATIONS).forEach(function(english) {

    const spanish = SPANISH_TRANSLATIONS[english];

    translated = translated
      .split(english)
      .join(spanish);

  });

  return translated;

}


/* =========================================================
   TRANSLATE PAGE
   ========================================================= */

function translateLeilaPedroPage() {

  /* Translate regular text */

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  const nodes = [];

  while (walker.nextNode()) {
    nodes.push(walker.currentNode);
  }

  nodes.forEach(function(node) {

    const parent = node.parentElement;

    /*
     * Don't modify script/style elements.
     */

    if (
      parent &&
      (
        parent.tagName === "SCRIPT" ||
        parent.tagName === "STYLE"
      )
    ) {
      return;
    }

    const original = node.nodeValue;

    const translated = translateText(original);

    if (translated !== original) {
      node.nodeValue = translated;
    }

  });


  /* Translate input placeholders */

  document.querySelectorAll("input").forEach(function(input) {

    if (input.placeholder === "Add a note (optional)") {
      input.placeholder = "Agregar una nota (opcional)";
    }

  });


  /* Translate textarea placeholders */

  document.querySelectorAll("textarea").forEach(function(textarea) {

    if (textarea.placeholder === "Add a note (optional)") {
      textarea.placeholder = "Agregar una nota (opcional)";
    }

  });


  /* Translate Par labels */

  document.querySelectorAll(".par-badge").forEach(function(el) {

    if (el.textContent.includes("Par:")) {
      el.textContent = el.textContent.replace(
        "Par:",
        "Mínimo:"
      );
    }

  });


  /* Translate status labels */

  document.querySelectorAll(".status-out").forEach(function(el) {
    el.textContent = "AGOTADO";
  });

  document.querySelectorAll(".status-low").forEach(function(el) {
    el.textContent = "BAJO";
  });

  document.querySelectorAll(".status-ok").forEach(function(el) {
    el.textContent = "OK";
  });


  /* Translate progress */

  const progressLabel =
    document.getElementById("progress-label-text");

  if (progressLabel) {

    progressLabel.textContent =
      progressLabel.textContent
        .replace(" checked", " marcados")
        .replace(" Checked", " Marcados");

  }

}


/* =========================================================
   AUTOMATIC TRANSLATION FOR DYNAMIC CONTENT
   ========================================================= */

const spanishObserver = new MutationObserver(function() {

  translateLeilaPedroPage();

});

spanishObserver.observe(document.body, {

  childList: true,
  subtree: true

});


/* =========================================================
   INITIALIZE CHECKLIST
   ========================================================= */

initChecklist();


/* =========================================================
   INITIAL TRANSLATION
   ========================================================= */

setTimeout(function() {

  translateLeilaPedroPage();

}, 100);

setTimeout(function() {

  translateLeilaPedroPage();

}, 500);

setTimeout(function() {

  translateLeilaPedroPage();

}, 1000);

</script>

</body>
</html>
