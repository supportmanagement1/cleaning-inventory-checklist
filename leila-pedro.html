<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lista de Inventario — Leila &amp; Pedro</title>
<link rel="stylesheet" href="assets/style.css" />
</head>

<body>

<script>
  window.CLEANER_ID = "leila-pedro";
  window.CLEANER_NAME = "Leila & Pedro";
  window.CLEANER_PROPERTIES = [
    "Bates Walk",
    "Edgar's Bungalow"
  ];
</script>

<div class="topbar">
  <h1>Lista de Inventario</h1>
  <p class="subtitle">
    Asignado a: <span id="cleaner-name"></span>
  </p>
</div>

<div class="container">

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progress-label-text">0 / 0 marcados</span>
      <span id="last-saved"></span>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="actions">

    <button class="btn btn-primary" id="copy-btn">
      Copiar Lista de Reposición
    </button>

    <button class="btn btn-primary" id="submit-btn">
      Enviar Lista de Reposición
    </button>

    <button class="btn btn-secondary" id="print-btn">
      Imprimir
    </button>

    <button class="btn btn-secondary" id="reset-btn">
      Reiniciar
    </button>

  </div>

  <div id="submit-status" class="submit-status"></div>

  <div id="checklist-root"></div>

</div>

<div class="copy-modal-overlay" id="copy-modal-overlay">

  <div class="copy-modal">

    <h3 id="modal-title">Lista de Reposición</h3>

    <p id="modal-subtitle">
      Copiado. Puedes pegar esta lista en un mensaje o correo electrónico para tu gerente.
    </p>

    <textarea id="copy-textarea" readonly></textarea>

    <div class="actions">

      <button class="btn btn-primary" id="close-modal-btn">
        Cerrar
      </button>

    </div>

  </div>

</div>

<script src="assets/items.js"></script>
<script src="assets/app.js"></script>

<script>

/*
 * Spanish translations for Leila & Pedro.
 * This runs AFTER the existing checklist has been initialized.
 */

const SPANISH_TRANSLATIONS = {

  "Kitchen Essentials": "Artículos esenciales de cocina",
  "Bathroom": "Baño",
  "Laundry": "Lavandería",
  "Cleaning Supplies": "Productos de limpieza",

  "Coffee": "Café",
  "Salt": "Sal",
  "Pepper": "Pimienta",
  "Cooking Oil": "Aceite de cocina",
  "Aluminum Foil": "Papel de aluminio",
  "Plastic Wrap": "Papel film",
  "Zip-top Bags": "Bolsas con cierre",
  "Dish Soap": "Jabón para platos",
  "Dishwasher Pods": "Cápsulas para lavavajillas",
  "Kitchen Sponge": "Esponja de cocina",
  "Paper Towels": "Toallas de papel",
  "Trash Bags": "Bolsas de basura",

  "Toilet Paper": "Papel higiénico",
  "Facial Tissue": "Pañuelos desechables",
  "Hand Soap": "Jabón de manos",
  "Shampoo": "Champú",
  "Conditioner": "Acondicionador",
  "Body Wash": "Gel de baño",
  "Mini Trash Bags": "Bolsas pequeñas de basura",

  "Detergent": "Detergente",
  "Dryer Sheets": "Toallitas para secadora",

  "Multi-surface Cleaner": "Limpiador multisuperficie",
  "Bathroom Cleaner": "Limpiador de baño",
  "Disinfectant Spray": "Spray desinfectante"
};


/*
 * Translate text that already exists on the page.
 */

function translateSpanishPage() {

  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  const textNodes = [];

  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(function(node) {

    if (
      node.parentElement &&
      (
        node.parentElement.tagName === "SCRIPT" ||
        node.parentElement.tagName === "STYLE"
      )
    ) {
      return;
    }

    let text = node.nodeValue;

    Object.keys(SPANISH_TRANSLATIONS).forEach(function(english) {

      text = text.split(english).join(
        SPANISH_TRANSLATIONS[english]
      );

    });

    node.nodeValue = text;

  });


  /*
   * Notes
   */

  document.querySelectorAll("input").forEach(function(input) {

    if (input.placeholder === "Add a note (optional)") {
      input.placeholder = "Agregar una nota (opcional)";
    }

  });


  /*
   * Par / minimum quantity
   */

  document.querySelectorAll(".par-badge").forEach(function(element) {

    element.textContent =
      element.textContent.replace("Par:", "Mínimo:");

  });


  /*
   * Inventory status
   */

  document.querySelectorAll(".status-out").forEach(function(element) {
    element.textContent = "AGOTADO";
  });

  document.querySelectorAll(".status-low").forEach(function(element) {
    element.textContent = "BAJO";
  });

  document.querySelectorAll(".status-ok").forEach(function(element) {
    element.textContent = "OK";
  });

}


/*
 * Wait until the existing app has created the inventory,
 * then translate it.
 */

setTimeout(function() {
  translateSpanishPage();
}, 300);

setTimeout(function() {
  translateSpanishPage();
}, 1000);

setTimeout(function() {
  translateSpanishPage();
}, 2000);


/*
 * Translate inventory items whenever the existing app
 * changes the page.
 */

const spanishObserver = new MutationObserver(function() {

  translateSpanishPage();

});

spanishObserver.observe(document.getElementById("checklist-root"), {
  childList: true,
  subtree: true
});

</script>

</body>
</html>
